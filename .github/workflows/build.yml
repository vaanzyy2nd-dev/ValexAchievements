name: Build ValexAchievements

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ValexAchievements
          path: target/ValexAchievements.jar
